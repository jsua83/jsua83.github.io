<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정재학 앨범</title>
<meta name="description" content="정재학 목사 · 푸른동산 지산교회 사진 자료실.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --paper: #fbfcfb;
    --surface: #ffffff;
    --brand-dark: #1f4d3a;
    --brand: #2e7d5b;
    --brand-accent: #4a9b73;
    --brand-soft: #e8f2ec;
    --ink: #23291f;
    --ink-soft: #515b52;
    --line: #d9e4dc;
    --serif: "Gowun Batang", "Nanum Myeongjo", serif;
    --sans: "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #11160f; --surface: #1a2018; --brand-dark: #e7f0e9;
      --brand: #74c6a0; --brand-accent: #93d6b6; --brand-soft: #223027;
      --ink: #e9ede6; --ink-soft: #a6b0a5; --line: #2e3a30;
    }
  }
  :root[data-theme="dark"] {
    --paper: #11160f; --surface: #1a2018; --brand-dark: #e7f0e9;
    --brand: #74c6a0; --brand-accent: #93d6b6; --brand-soft: #223027;
    --ink: #e9ede6; --ink-soft: #a6b0a5; --line: #2e3a30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.7;
    font-size: 16px;
  }
  img { max-width: 100%; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar__inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 0.7rem 1.3rem;
  }
  .back {
    font-size: 0.85rem;
    color: var(--brand);
    text-decoration: none;
  }
  .back:hover { color: var(--brand-dark); }
  .back:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .yearnav {
    position: sticky;
    top: 37px;
    z-index: 9;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .yearnav::-webkit-scrollbar { display: none; }
  .yearnav__inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 0.55rem 1.3rem;
    display: inline-flex;
    gap: 0.4rem;
  }
  .yearnav a {
    flex: none;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.28rem 0.8rem;
    text-decoration: none;
  }
  .yearnav a:hover { border-color: var(--brand-accent); color: var(--brand); }
  .yearnav a:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  .wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 2.6rem 1.3rem 5rem;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.9rem;
    color: var(--brand-dark);
    margin: 0 0 0.4rem;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin: 0 0 2rem;
  }

  #status {
    color: var(--ink-soft);
    font-size: 0.92rem;
    padding: 2rem 0;
    text-align: center;
  }

  .year-section { scroll-margin-top: 84px; margin-bottom: 2.6rem; }
  .year-section h2 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--brand-dark);
    margin: 0 0 0.9rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--line);
  }
  .year-section h2 .count {
    font-family: var(--sans);
    font-weight: 400;
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-left: 0.5rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .shot {
    display: block;
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--brand-soft);
  }
  .shot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }
  .shot:hover img { transform: scale(1.06); }
  .shot:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .shot img { transition: none; }
    .shot:hover img { transform: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar__inner">
    <a class="back" href="https://jsua83.github.io/">&larr; 정재학 말씀 자료방</a>
  </div>
</div>

<nav class="yearnav" id="yearnav" hidden aria-label="연도 바로가기">
  <div class="yearnav__inner" id="yearnavInner"></div>
</nav>

<div class="wrap">
  <h1>정재학 앨범</h1>
  <p class="sub" id="countLine"></p>
  <p id="status">사진을 불러오는 중&hellip;</p>
  <div id="sections"></div>
</div>

<script>
  (function () {
    var API = "https://api.github.com/repos/jsua83/jsua83.github.io/contents/album";
    var IMG_RE = /\.(jpe?g|png|gif|webp)$/i;
    var YEAR_RE = /^(\d{4})-/;
    var status = document.getElementById("status");
    var sections = document.getElementById("sections");
    var yearnav = document.getElementById("yearnav");
    var yearnavInner = document.getElementById("yearnavInner");
    var countLine = document.getElementById("countLine");

    fetch(API)
      .then(function (res) {
        if (res.status === 404) return [];
        if (!res.ok) throw new Error("load failed");
        return res.json();
      })
      .then(function (items) {
        var photos = (items || [])
          .filter(function (it) { return it.type === "file" && IMG_RE.test(it.name); })
          .sort(function (a, b) { return b.name.localeCompare(a.name, "ko"); });

        if (photos.length === 0) {
          status.textContent = "아직 올라온 사진이 없습니다.";
          return;
        }
        status.remove();
        countLine.textContent = photos.length + "장";

        var groups = [];
        var byYear = {};
        photos.forEach(function (p) {
          var m = p.name.match(YEAR_RE);
          var year = m ? m[1] : "미분류";
          if (!byYear[year]) {
            byYear[year] = { year: year, items: [] };
            groups.push(byYear[year]);
          }
          byYear[year].items.push(p);
        });

        groups.forEach(function (grp) {
          var link = document.createElement("a");
          link.href = "#y" + grp.year;
          link.textContent = grp.year === "미분류" ? "미분류" : grp.year;
          yearnavInner.appendChild(link);

          var section = document.createElement("section");
          section.className = "year-section";
          section.id = "y" + grp.year;

          var h2 = document.createElement("h2");
          h2.textContent = (grp.year === "미분류" ? "미분류" : grp.year + "년");
          var count = document.createElement("span");
          count.className = "count";
          count.textContent = grp.items.length + "장";
          h2.appendChild(count);
          section.appendChild(h2);

          var grid = document.createElement("div");
          grid.className = "grid";
          grp.items.forEach(function (p) {
            var a = document.createElement("a");
            a.className = "shot";
            a.href = p.download_url;
            a.target = "_blank";
            a.rel = "noopener";
            var img = document.createElement("img");
            img.src = p.download_url;
            img.loading = "lazy";
            img.alt = p.name.replace(/\.[a-z]+$/i, "").replace(/[-_]/g, " ");
            a.appendChild(img);
            grid.appendChild(a);
          });
          section.appendChild(grid);
          sections.appendChild(section);
        });

        yearnav.hidden = false;
      })
      .catch(function () {
        status.textContent = "사진을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
      });
  })();
</script>

</body>
</html>
